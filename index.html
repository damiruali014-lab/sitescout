<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SiteScout finds small businesses without a good website, checks their site, scores the lead and drafts a demo page and outreach message." />
    <meta name="theme-color" content="#0f766e" />
    <title>SiteScout — find businesses that need a website</title>
    <script>
      // Apply theme before paint to avoid a flash. ?theme=dark|light wins (used by the portfolio iframe).
      (function () {
        try {
          var p = new URLSearchParams(location.search).get('theme');
          var t = p || localStorage.getItem('sitescout-theme');
          if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
